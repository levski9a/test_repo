<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c1229">
<title>Тайна мисия · Ниво 2</title>
<style>
  :root { color-scheme: dark; --ink:#f4f7ff; --muted:#a8b4d7; --accent:#7be7d7; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100svh; padding:24px 14px; display:grid; place-items:center; background:radial-gradient(ellipse at top,#24335b 0%,#0c1229 58%,#090d1c 100%); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); }
  .card { width:min(100%,540px); overflow:hidden; text-align:center; padding:28px 20px 26px; border:1px solid #ffffff28; border-radius:26px; background:#14203add; box-shadow:0 22px 65px #0005; }
  .eyebrow { display:inline-block; font-size:12px; font-weight:800; letter-spacing:.18em; padding:8px 13px; border-radius:999px; color:var(--accent); background:#7be7d719; }
  h1 { margin:17px 0 3px; font-size:clamp(27px,6vw,38px); letter-spacing:.025em; }
  .subtitle { color:var(--muted); font-size:14px; margin:0 0 12px; }
  .scene { position:relative; width:100%; max-width:460px; margin:auto; aspect-ratio:460 / 270; overflow:hidden; border-radius:18px; background:linear-gradient(#1d3052,#253d5b); }
  .scene::before { content:""; position:absolute; inset:0; background-image:radial-gradient(#d9f6ff80 1px,transparent 1px); background-size:43px 41px; opacity:.32; }
  .steps { position:absolute; left:4%; bottom:12%; width:92%; height:72%; }
  .step { position:absolute; bottom:0; background:linear-gradient(160deg,#708ab0,#4d6487); border:2px solid #afc4e6; border-bottom:0; border-radius:5px 5px 0 0; box-shadow:inset 0 8px #ffffff1a; }
  .s1{left:0;width:20%;height:20%}.s2{left:20%;width:20%;height:40%}.s3{left:40%;width:20%;height:60%}.s4{left:60%;width:20%;height:80%}.s5{left:80%;width:20%;height:100%}
  .walker { position:absolute; width:15%; left:4%; bottom:26%; transform-origin:50% 100%; animation:climb 6s ease-in-out infinite; filter:drop-shadow(0 4px 3px #0006); }
  .walker svg { width:100%; display:block; overflow:visible; }
  .arm-a { transform-origin:29px 38px; animation:swingA .5s ease-in-out infinite alternate; }
  .arm-b { transform-origin:29px 38px; animation:swingB .5s ease-in-out infinite alternate; }
  .leg-a { transform-origin:29px 56px; animation:swingB .5s ease-in-out infinite alternate; }
  .leg-b { transform-origin:29px 56px; animation:swingA .5s ease-in-out infinite alternate; }
  @keyframes climb {0%,7%{left:4%;bottom:26%} 18%{left:21%;bottom:40%} 35%{left:39%;bottom:54%} 52%{left:57%;bottom:69%} 70%,86%{left:76%;bottom:84%} 100%{left:4%;bottom:26%}}
  @keyframes swingA {from{transform:rotate(-24deg)}to{transform:rotate(22deg)}}
  @keyframes swingB {from{transform:rotate(24deg)}to{transform:rotate(-22deg)}}
  .instruction { margin:20px 0 6px; font-weight:800; font-size:clamp(25px,6vw,33px); line-height:1.25; }
  .hint { margin:0 auto; color:var(--muted); font-size:15px; line-height:1.55; max-width:350px; }
  button { border:0; cursor:pointer; font:inherit; font-weight:700; background:var(--accent); color:#102136; border-radius:12px; padding:12px 20px; margin-top:22px; }
  button:focus-visible { outline:3px solid white; outline-offset:4px; }
  @media(prefers-reduced-motion:reduce){.walker,.arm-a,.arm-b,.leg-a,.leg-b{animation:none}.walker{left:76%;bottom:84%}}
</style>
</head>
<body>
<main class="card">
  <div class="eyebrow">🔎 ТАЙНА МИСИЯ · НИВО 2 / 5</div>
  <h1>Следващата следа</h1>
  <p class="subtitle">Следвай указанието, за да продължиш!</p>
  <div class="scene" role="img" aria-label="Анимирано двуизмерно човече се изкачва по пет стъпала">
    <div class="steps" aria-hidden="true"><div class="step s1"></div><div class="step s2"></div><div class="step s3"></div><div class="step s4"></div><div class="step s5"></div></div>
    <div class="walker" aria-hidden="true"><svg viewBox="0 0 58 91" xmlns="http://www.w3.org/2000/svg"><circle cx="29" cy="14" r="11" fill="#ffdfb6" stroke="#112844" stroke-width="3"/><path d="M21 8 Q28 -1 38 9" fill="none" stroke="#162038" stroke-width="5" stroke-linecap="round"/><path d="M29 27 L29 55" stroke="#7be7d7" stroke-width="10" stroke-linecap="round"/><g class="arm-a"><path d="M29 37 L12 54" stroke="#ffdfb6" stroke-width="6" stroke-linecap="round"/></g><g class="arm-b"><path d="M29 37 L46 53" stroke="#ffdfb6" stroke-width="6" stroke-linecap="round"/></g><g class="leg-a"><path d="M29 55 L17 80" stroke="#e2eaff" stroke-width="7" stroke-linecap="round"/></g><g class="leg-b"><path d="M29 55 L42 80" stroke="#e2eaff" stroke-width="7" stroke-linecap="round"/></g></svg></div>
  </div>
  <!-- Промени текста тук за следващите нива: -->
  <p class="instruction">⬆️ Качи се по стълбите!</p>
  <p class="hint">Горе потърси следващия QR код. Движи се спокойно и не тичай по стълбите.</p>
  <button type="button" id="replay">↻ Пусни анимацията отново</button>
</main>
<script>
  document.getElementById('replay').addEventListener('click', () => {
    const walker = document.querySelector('.walker');
    walker.style.animation = 'none';
    void walker.offsetWidth;
    walker.style.animation = '';
  });
</script>
</body>
</html>
